<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarjeta Digital</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #eeeeee;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px 15px;
}

.tarjeta {
  width: 100%;
  max-width: 390px;
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 8px 30px rgba(0,0,0,0.10);
}

.encabezado {
  background: #111111;
  color: white;
  text-align: center;
  padding: 35px 20px;
}

.foto {
  width: 115px;
  height: 115px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid white;
  margin-bottom: 16px;
}

.nombre {
  font-size: 25px;
  font-weight: bold;
  margin: 0;
}

.subtitulo {
  color: #bbbbbb;
  font-size: 13px;
  margin-top: 8px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.contenido {
  padding: 28px 25px 20px;
}

.descripcion {
  text-align: center;
  color: #777777;
  font-size: 14px;
  margin: 0 0 24px;
}

.boton {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  padding: 15px;
  margin-bottom: 13px;
  border: 1px solid #dddddd;
  border-radius: 9px;
  color: #222222;
  text-decoration: none;
  font-size: 15px;
  font-weight: 600;
}

.boton:hover {
  background: #f2f2f2;
}

.boton svg {
  width: 21px;
  height: 21px;
}

.pie {
  text-align: center;
  color: #aaaaaa;
  font-size: 11px;
  padding: 5px 10px 22px;
  letter-spacing: 1px;
}
</style>
</head>

<body>

<div class="tarjeta" id="tarjeta">

  <div class="encabezado">
    <img class="foto" id="foto" src="" alt="Foto del barbero">
    <h1 class="nombre" id="nombre"></h1>
    <div class="subtitulo">Equipo TheWolf</div>
  </div>

  <div class="contenido">

    <p class="descripcion">
      Encuéntrame en mis redes y agenda tu hora.
    </p>

    <!-- INSTAGRAM -->
    <a class="boton" id="instagram" href="#" target="_blank">
      <svg viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="18" cy="6" r="1" fill="currentColor"/>
      </svg>
      Instagram
    </a>

    <!-- WHATSAPP -->
    <a class="boton" id="whatsapp" href="#" target="_blank">
      <svg viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.5 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20l1.2-4.7A8.5 8.5 0 1 1 20.5 11.5Z"/>
        <path d="M9 8.5c.5 2.5 2 4 4.5 5"/>
        <path d="M9 8.5l1.5-1M13.5 13.5l1.5-1"/>
      </svg>
      WhatsApp
    </a>

    <!-- AGENDAR HORA -->
    <a class="boton" id="agenda" href="#" target="_blank">
      <svg viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="16" rx="2"/>
        <path d="M16 3v4M8 3v4M3 10h18"/>
        <path d="m9 15 2 2 4-4"/>
      </svg>
      Agendar hora
    </a>

  </div>

  <div class="pie">TARJETA DIGITAL</div>

</div>

<script>

// DATOS DE LOS BARBEROS
// Aquí podremos agregar, editar o eliminar barberos.

const barberos = [

  {
    id: "barbero1",
    nombre: "Rodrigo",
    foto: "rodrigo.jpg",
    instagram: "https://www.instagram.com/thewolfsalon?obrf=a2V6dnhzdHFiMnlx",
    whatsapp: "56984052763",
    agenda: "https://the-wolf.cl/pages/reservas"
  },

  {
    id: "barbero2",
    nombre: "Catalina Rojas",
    foto: "barbera2.webp",
    instagram: "https://www.instagram.com/",
    whatsapp: "56912345678",
    agenda: "https://www.google.com"
  }

];

// IDENTIFICAR AL BARBERO SEGÚN SU ENLACE

const parametros = new URLSearchParams(window.location.search);

const id = parametros.get("barbero") || "barbero1";

const barbero = barberos.find(persona => persona.id === id);

// MOSTRAR SU INFORMACIÓN

if (barbero) {

  document.getElementById("nombre").textContent = barbero.nombre;

  document.getElementById("foto").src = barbero.foto;

  document.getElementById("instagram").href = barbero.instagram;

  document.getElementById("whatsapp").href =
    "https://wa.me/" + barbero.whatsapp;

  document.getElementById("agenda").href = barbero.agenda;

  document.title = barbero.nombre + " | Tarjeta Digital";

} else {

  document.getElementById("tarjeta").innerHTML =
    "<p style='padding:30px;text-align:center'>Barbero no encontrado.</p>";

}

</script>

</body>
</html>
